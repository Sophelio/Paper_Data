# Lorenz representation benchmark — frozen configuration.
#
# Every value here is declared BEFORE any protected-test evaluation.
# Changing anything under `ensemble`, `splits`, or `information_boundary`
# invalidates the frozen splits and requires regenerating from scratch.

system:
  name: lorenz
  sigma: 10.0
  rho: 28.0
  beta: 2.6666666666666665   # 8/3
  # Canonical manuscript generator, reused rather than re-implemented.
  generator: "D:/SIR_paper/Lorenz/Lorenz_attractor.py::generate_lorenz"
  integrator: DOP853
  rtol: 1.0e-12
  atol: 1.0e-12

containment:
  # Reuses the manuscript's own single trajectory verbatim.
  source: "D:/SIR_paper/Lorenz/data/lorenz_dt001_exact_derivatives.parquet"
  polynomial_degree: 3
  # Ground-truth Lorenz support, used only for scoring the recovered equations.
  true_terms:
    dx: {x: -10.0, y: 10.0}
    dy: {x: 28.0, y: -1.0, "x z": -1.0}
    dz: {"x y": 1.0, z: -2.6666666666666665}

ensemble:
  n_trajectories: 48
  dt: 0.005            # observation spacing for the benchmark
  tmax: 12.0           # 2401 samples per trajectory
  seed: 20260827
  # Initial states are drawn from a single long canonical trajectory so every
  # benchmark trajectory starts ON the attractor.
  seed_traj_dt: 0.001
  seed_traj_tmax: 400.0
  seed_traj_burn_in: 20.0
  seed_traj_x0: [1.0, 1.0, 1.0]

splits:
  seed: 20260827
  n_train: 32
  n_validation: 8
  n_test: 8            # PROTECTED — never used for any selection

task:
  # Retrospective reconstruction, NOT forecasting.
  kind: retrospective_reconstruction
  observed: [x, y]
  target: z
  forbidden_dependencies: [z, dz, d2z]

information_boundary:
  # Common retrospective local information set I_k shared by every method.
  stencil: centered_5point
  half_width: 2                 # x[k-2..k+2], y[k-2..k+2]
  derivative_scheme: centered_5point
  # Interior mask: samples without a full stencil are dropped for ALL methods.
  drop_edges: 2

coordinates:
  # Reference-shifted family defaults — canonical SIR values, NOT tuned here.
  rho: 0.1
  kappa: 1.0
  scale_method: pooled_rms
  # Denominator conditioning for classical phase quotients.
  quotient_mask_quantile: 0.05   # mask |denominator| below this train quantile

selection:
  # Declared BEFORE seeing test data.
  criterion: validation_rmse
  # Candidates within this relative tolerance of the best are "indistinguishable";
  # among them prefer fewer coordinates, then better conditioning.
  equivalence_rel_tol: 0.02
  max_coordinates: 12

estimators:
  stlsq:
    thresholds: [1.0e-4, 1.0e-3, 1.0e-2, 5.0e-2, 1.0e-1, 5.0e-1]
    alpha: 0.0
    max_iter: 40
  mlp:
    hidden_layer_sizes: [64, 64]
    activation: relu
    solver: adam
    alpha: 1.0e-4
    learning_rate_init: 1.0e-3
    max_iter: 400
    early_stopping: true
    n_iter_no_change: 20
    seeds: [0, 1, 2, 3, 4]

ablations:
  train_fractions: [0.10, 0.25, 0.50, 1.0]
  noise_levels: [0.0, 0.01, 0.05]   # fraction of train std, added to x,y only
  downsample_factors: [1, 2, 4]
